<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート タイピングゲーム</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  text-align: center;
}

header {
  background: #1c2639;
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.status {
  margin: 12px;
  color: #9bdcff;
}

.question {
  background: #1d2940;
  border-radius: 12px;
  padding: 25px;
  margin-top: 20px;
}

#word {
  font-size: 42px;
  font-weight: bold;
  margin-bottom: 15px;
  overflow-wrap: anywhere;
}

#meaning {
  font-size: 20px;
  color: #d4e2f5;
  margin-bottom: 20px;
}

#romaji {
  font-family: monospace;
  font-size: 28px;
  letter-spacing: 2px;
  overflow-wrap: anywhere;
}

.correct {
  color: #66e7a5;
}

.remaining {
  color: #ffffff;
}

#message {
  min-height: 28px;
  margin-top: 15px;
  color: #ffda73;
}

.buttons {
  margin-top: 20px;
}

button {
  background: #3185f7;
  color: white;
  border: none;
  padding: 13px 24px;
  margin: 5px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 17px;
}

button:hover {
  background: #216bd0;
}

button:disabled {
  background: #555;
  cursor: not-allowed;
}

.keyboard {
  margin: 30px auto;
  max-width: 950px;
}

.keyrow {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin-bottom: 6px;
}

.key {
  background: #35425a;
  border: 1px solid #63728e;
  border-radius: 6px;
  min-width: 38px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  font-size: 18px;
}

.key.active {
  background: #ff4545;
  color: white;
  border-color: #ff9b9b;
}

.key.shift {
  min-width: 75px;
}

.key.space {
  width: 250px;
}

.key.bump {
  position: relative;
}

.key.bump::after {
  content: "";
  position: absolute;
  bottom: 5px;
  width: 12px;
  height: 2px;
  background: #ddd;
}

@media (max-width: 700px) {
  #word {
    font-size: 30px;
  }

  #romaji {
    font-size: 20px;
  }

  .key {
    min-width: 25px;
    height: 36px;
    font-size: 12px;
  }

  .key.shift {
    min-width: 45px;
  }

  .key.space {
    width: 130px;
  }
}
</style>
</head>

<body>

<header>ITパスポート タイピングゲーム</header>

<div class="container">

  <div class="status" id="status">
    スプレッドシートを読み込み中…
  </div>

  <div id="progress">0 / 10</div>

  <div class="question">

    <div id="word">スタートを押してください</div>

    <div id="meaning"></div>

    <div id="romaji"></div>

    <div id="message"></div>

  </div>

  <div class="buttons">
    <button id="startBtn" disabled>スタート（1）</button>
    <button id="skipBtn">スキップ（2）</button>
    <button id="speakBtn">読み上げ（3）</button>
  </div>

  <div class="keyboard" id="keyboard"></div>

</div>

<script>

const SHEET_ID =
"1Pperr1kTX8QshssUJioRD3rkL9wotE3YqwBj7DHf2h0";

const SHEET_URL =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;

const TOTAL_QUESTIONS = 10;

let words = [];
let questions = [];

let current = null;
let questionIndex = 0;
let typedIndex = 0;

let playing = false;
let speechTimer = null;
let speechGeneration = 0;
let nextTimer = null;

/* =========================
   キーボード作成
========================= */

const keyboardLayout = [
  "1234567890-",
  "qwertyuiop",
  "asdfghjkl",
  "zxcvbnm"
];

function createKeyboard() {

  const keyboard =
    document.getElementById("keyboard");

  keyboard.innerHTML = "";

  keyboardLayout.forEach(row => {

    const div = document.createElement("div");
    div.className = "keyrow";

    [...row].forEach(letter => {

      const key = document.createElement("div");

      key.className = "key";
      key.dataset.key = letter;
      key.textContent = letter.toUpperCase();

      if (letter === "f" || letter === "j") {
        key.classList.add("bump");
      }

      div.appendChild(key);

    });

    keyboard.appendChild(div);

  });

  const bottom = document.createElement("div");
  bottom.className = "keyrow";

  const shift = document.createElement("div");
  shift.className = "key shift";
  shift.textContent = "SHIFT";

  const space = document.createElement("div");
  space.className = "key space";
  space.textContent = "SPACE";

  bottom.appendChild(shift);
  bottom.appendChild(space);

  keyboard.appendChild(bottom);

}

function highlightKey() {

  document.querySelectorAll(".key")
    .forEach(key => key.classList.remove("active"));

  if (!playing || !current) return;

  const next = current.input[typedIndex];

  if (!next) return;

  const key = document.querySelector(
    `.key[data-key="${CSS.escape(next.toLowerCase())}"]`
  );

  if (key) key.classList.add("active");

}

/* =========================
   CSV解析
========================= */

function parseCSV(text) {

  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {

    const c = text[i];

    if (c === '"') {

      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }

    } else if (c === "," && !quoted) {

      row.push(cell);
      cell = "";

    } else if (
      (c === "\n" || c === "\r") && !quoted
    ) {

      if (c === "\r" && text[i + 1] === "\n") i++;

      row.push(cell);
      rows.push(row);

      row = [];
      cell = "";

    } else {

      cell += c;

    }

  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;

}

/* =========================
   スプレッドシート読み込み
========================= */

async function loadSheet() {

  const status = document.getElementById("status");

  try {

    const response = await fetch(
      SHEET_URL + "&cache=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const csv = await response.text();
    const rows = parseCSV(csv);

    words = [];

    for (const row of rows) {

      const word = (row[0] || "").trim();
      const meaning = (row[1] || "").trim();

      let input = (row[2] || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "");

      if (!word || !input) continue;

      // 英数字だけをタイピング対象にする
      if (!/^[a-z0-9]+$/.test(input)) continue;

      words.push({
        word,
        meaning,
        input
      });

    }

    if (words.length === 0) {
      throw new Error(
        "有効な課題がありません。C列を確認してください。"
      );
    }

    status.textContent =
      `${words.length}問のデータを読み込みました`;

    document.getElementById("startBtn")
      .disabled = false;

  } catch (error) {

    console.error(error);

    status.textContent =
      "読み込みエラー：" + error.message;

  }

}

/* =========================
   音声読み上げ
========================= */

function stopSpeech() {

  speechGeneration++;

  clearTimeout(speechTimer);
  speechTimer = null;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

}

function speakText(text, callback) {

  if (!("speechSynthesis" in window)) return;

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "ja-JP";
  utterance.rate = 0.9;

  utterance.onend = () => {
    if (callback) callback();
  };

  utterance.onerror = () => {
    if (callback) callback();
  };

  speechSynthesis.speak(utterance);

}

function repeatSpeech() {

  stopSpeech();

  if (!current || !playing) return;

  const generation = speechGeneration;

  function speakCycle() {

    if (
      !playing ||
      !current ||
      generation !== speechGeneration
    ) return;

    speakText(current.word, () => {

      if (generation !== speechGeneration) return;

      speakText(current.meaning, () => {

        if (generation !== speechGeneration) return;

        speechTimer = setTimeout(
          speakCycle,
          1000
        );

      });

    });

  }

  speakCycle();

}

/* =========================
   ゲーム
========================= */

function shuffle(array) {

  return [...array].sort(() => Math.random() - 0.5);

}

function startGame() {

  if (words.length === 0) return;

  stopSpeech();
  clearTimeout(nextTimer);

  questions = shuffle(words)
    .slice(0, TOTAL_QUESTIONS);

  questionIndex = 0;
  playing = true;

  showQuestion();

}

function showQuestion() {

  stopSpeech();
  clearTimeout(nextTimer);

  if (questionIndex >= questions.length) {

    finishGame();
    return;

  }

  current = questions[questionIndex];
  typedIndex = 0;

  document.getElementById("progress")
    .textContent =
    `${questionIndex + 1} / ${questions.length}`;

  document.getElementById("word")
    .textContent = current.word;

  document.getElementById("meaning")
    .textContent = current.meaning;

  document.getElementById("message")
    .textContent = "";

  updateRomaji();
  highlightKey();

  repeatSpeech();

}

function updateRomaji() {

  if (!current) return;

  const correct =
    current.input.slice(0, typedIndex);

  const remaining =
    current.input.slice(typedIndex);

  document.getElementById("romaji").innerHTML =
    `<span class="correct">${correct}</span>` +
    `<span class="remaining">${remaining}</span>`;

}

function completeQuestion() {

  stopSpeech();

  document.getElementById("message")
    .textContent = "正解！";

  highlightKey();

  nextTimer = setTimeout(() => {

    questionIndex++;
    showQuestion();

  }, 1500);

}

function skipQuestion() {

  if (!playing) return;

  stopSpeech();
  clearTimeout(nextTimer);

  questionIndex++;
  showQuestion();

}

function finishGame() {

  playing = false;
  current = null;

  stopSpeech();

  document.getElementById("word")
    .textContent = "終了！";

  document.getElementById("meaning")
    .textContent = "10問お疲れさまでした。";

  document.getElementById("romaji")
    .textContent = "";

  document.getElementById("message")
    .textContent = "1を押すともう一度スタート";

  highlightKey();

}

/* =========================
   キー入力
========================= */

document.addEventListener("keydown", event => {

  if (event.ctrlKey || event.altKey || event.metaKey) {
    return;
  }

  const key = event.key.toLowerCase();

  if (key === "1") {
    event.preventDefault();
    startGame();
    return;
  }

  if (key === "2") {
    event.preventDefault();
    skipQuestion();
    return;
  }

  if (key === "3") {
    event.preventDefault();
    repeatSpeech();
    return;
  }

  if (!playing || !current) return;

  if (key.length !== 1) return;

  event.preventDefault();

  const expected = current.input[typedIndex];

  if (key === expected) {

    typedIndex++;

    updateRomaji();
    highlightKey();

    if (typedIndex >= current.input.length) {
      completeQuestion();
    }

  } else {

    document.getElementById("message")
      .textContent = "入力ミス";

    setTimeout(() => {

      if (playing) {
        document.getElementById("message")
          .textContent = "";
      }

    }, 500);

  }

});

/* =========================
   ボタン
========================= */

document.getElementById("startBtn")
  .addEventListener("click", startGame);

document.getElementById("skipBtn")
  .addEventListener("click", skipQuestion);

document.getElementById("speakBtn")
  .addEventListener("click", repeatSpeech);

/* =========================
   初期化
========================= */

createKeyboard();
loadSheet();

</script>

</body>
</html>
