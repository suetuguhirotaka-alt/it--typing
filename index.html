<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート 用語タイピング練習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  margin: 0;
  padding: 15px;
  color: #222;
}

main {
  max-width: 780px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 3px 15px #0001;
}

h2 {
  text-align: center;
  color: #0d47a1;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  padding: 11px 15px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  background: #dce7f5;
}

button:hover {
  background: #bfd5f0;
}

button:disabled {
  opacity: .5;
}

#start {
  background: #0d47a1;
  color: white;
}

#term {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  color: #0d47a1;
  margin: 25px 0 10px;
  overflow-wrap: anywhere;
}

#meaning {
  text-align: center;
  font-size: 16px;
  line-height: 1.7;
  min-height: 65px;
  margin-bottom: 15px;
  white-space: pre-wrap;
}

#progress {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

#typing {
  text-align: center;
  font-family: monospace;
  font-size: 25px;
  background: #f5f7fa;
  border-radius: 8px;
  padding: 15px;
  min-height: 60px;
  overflow-wrap: anywhere;
}

.correct {
  color: green;
}

.wrong {
  color: red;
  background: #ffe5e5;
}

.next {
  color: blue;
  text-decoration: underline;
}

#answer {
  width: 100%;
  padding: 14px;
  font-size: 24px;
  text-align: center;
  border: 2px solid #ccc;
  border-radius: 10px;
  margin-top: 15px;
}

#guide {
  text-align: center;
  color: #0d47a1;
  font-weight: bold;
  margin: 15px 0;
  min-height: 25px;
}

#keyboard {
  margin-top: 20px;
}

.keyrow {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 5px;
}

.key {
  flex: 1;
  max-width: 50px;
  height: 42px;
  background: #eee;
  border: 1px solid #bbb;
  border-radius: 6px;
  text-align: center;
  line-height: 40px;
  font-weight: bold;
}

.key.active {
  background: #f44336;
  color: white;
}

#status {
  text-align: center;
  margin: 15px 0;
  font-size: 14px;
  color: #666;
}

#manualArea {
  margin-top: 25px;
  border-top: 1px solid #ddd;
  padding-top: 15px;
}

textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  margin-top: 8px;
}

@media(max-width:600px) {
  main {
    padding: 12px;
  }

  #term {
    font-size: 27px;
  }

  .key {
    height: 34px;
    line-height: 32px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<main>

<h2>💻 ITパスポート 用語タイピング練習</h2>

<div class="buttons">
  <button id="start">スタート [1]</button>
  <button id="skip">スキップ [2]</button>
  <button id="speak">🔊 読み上げ [3]</button>
</div>

<div id="status">データを読み込み中...</div>

<div id="progress"></div>

<div id="term">スタートを押してください</div>

<div id="meaning"></div>

<div id="typing"></div>

<input
  id="answer"
  type="text"
  autocomplete="off"
  spellcheck="false"
  placeholder="ここに課題を入力"
  disabled
>

<div id="guide"></div>

<div id="keyboard"></div>

<div id="manualArea">
  <details>
    <summary>データを手動で読み込む</summary>

    <p>
      スプレッドシートのA列・B列をコピーして、
      下に貼り付けてください。
    </p>

    <textarea
      id="manualData"
      placeholder="IPS	不正侵入防止システム&#10;損益分岐点	売上高と総費用が等しくなる点"
    ></textarea>

    <button id="loadManual">貼り付けたデータを読み込む</button>
  </details>
</div>

</main>

<script>

// =====================================
// Googleスプレッドシート設定
// =====================================

const SHEET_ID =
"1Pperr1kTX8QshssUJioRD3rkL9wotE3YqwBj7DHf2h0";

const CSV_URL =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;


// =====================================
// 基本設定
// =====================================

const TOTAL = 10;

let wordList = [];
let currentWord = null;

let questionNumber = 0;
let score = 0;

let playing = false;
let locked = false;
let composing = false;

let questionTimer = null;

const $ = id => document.getElementById(id);


// =====================================
// CSV解析
// =====================================

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {

    const c = text[i];

    if (c === '"') {

      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }

    } else if (c === "," && !quoted) {

      row.push(cell);
      cell = "";

    } else if (
      (c === "\n" || c === "\r") &&
      !quoted
    ) {

      if (c === "\r" && text[i + 1] === "\n") {
        i++;
      }

      row.push(cell);
      rows.push(row);

      row = [];
      cell = "";

    } else {

      cell += c;

    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}


// =====================================
// データ登録
// A列：課題
// B列：解説
// =====================================

function registerWords(rows) {

  const words = rows.map(row => {

    return {
      term: String(row[0] || "").trim(),
      meaning: String(row[1] || "").trim()
    };

  }).filter(item => {

    if (!item.term) return false;

    if (
      item.term === "課題" ||
      item.term === "必須用語" ||
      item.term === "A列"
    ) {
      return false;
    }

    return true;

  });

  wordList = words;

  $("status").textContent =
    `${wordList.length}語の読み込み完了`;

  $("start").disabled = false;

  return words.length;
}


// =====================================
// Googleからデータ取得
// =====================================

async function loadGoogleData() {

  $("status").textContent =
    "Googleスプレッドシートを読み込み中...";

  $("start").disabled = true;

  try {

    const response = await fetch(
      CSV_URL,
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const csv = await response.text();

    if (
      csv.trim().startsWith("<!DOCTYPE") ||
      csv.trim().startsWith("<html")
    ) {
      throw new Error("CSVではなくHTMLが返されました");
    }

    const rows = parseCSV(csv);

    const count = registerWords(rows);

    if (count === 0) {
      throw new Error("有効な課題が0件です");
    }

  } catch (error) {

    wordList = [];

    $("status").textContent =
      "データの取得に失敗しました。" +
      "スプレッドシートの公開設定を確認してください。" +
      "または下の手動入力を利用してください。" +
      "（" + error.message + "）";

  }
}


// =====================================
// 手動データ読み込み
// =====================================

$("loadManual").onclick = () => {

  const text = $("manualData").value.trim();

  if (!text) {
    alert("データを貼り付けてください");
    return;
  }

  const rows = text.split(/\r?\n/).map(line => {

    return line.split("\t");

  });

  const count = registerWords(rows);

  if (count === 0) {
    alert("有効な課題がありません");
    return;
  }

  alert(`${count}語を読み込みました`);

};


// =====================================
// キーボード作成
// =====================================

const KEY_ROWS = [
  "QWERTYUIOP",
  "ASDFGHJKL",
  "ZXCVBNM"
];

function createKeyboard() {

  const keyboard = $("keyboard");

  keyboard.innerHTML = "";

  KEY_ROWS.forEach(row => {

    const div = document.createElement("div");

    div.className = "keyrow";

    for (const char of row) {

      const key = document.createElement("div");

      key.className = "key";

      key.dataset.key = char;

      key.textContent = char;

      div.appendChild(key);

    }

    keyboard.appendChild(div);

  });

}

createKeyboard();


// =====================================
// 文字列の正規化
// =====================================

function normalize(text) {

  return String(text || "")
    .normalize("NFKC")
    .trim()
    .toLowerCase();

}


// =====================================
// 表示更新
// =====================================

function updateGuide() {

  document.querySelectorAll(".key")
    .forEach(key => {
      key.classList.remove("active");
    });

  if (!playing || !currentWord) return;

  const target = normalize(currentWord.term);

  const typed = normalize($("answer").value);

  const box = $("typing");

  box.innerHTML = "";

  let mismatch = false;

  const targetChars = Array.from(target);
  const typedChars = Array.from(typed);

  targetChars.forEach((char, index) => {

    const span = document.createElement("span");

    span.textContent = char;

    if (index < typedChars.length) {

      if (typedChars[index] === char) {

        span.className = "correct";

      } else {

        span.className = "wrong";
        mismatch = true;

      }

    } else if (index === typedChars.length) {

      span.className = "next";

    }

    box.appendChild(span);

  });

  if (mismatch || typedChars.length > targetChars.length) {

    $("guide").textContent =
      "入力が違います。Backspaceで修正してください。";

    return;
  }

  if (typedChars.length >= targetChars.length) {

    $("guide").textContent = "";

    return;
  }

  const nextChar = targetChars[typedChars.length];

  if (/^[a-z]$/i.test(nextChar)) {

    const key = nextChar.toUpperCase();

    const element =
      document.querySelector(`[data-key="${key}"]`);

    if (element) {
      element.classList.add("active");
    }

    $("guide").textContent =
      `次に打つキー：${key}`;

  } else if (/^[0-9]$/.test(nextChar)) {

    $("guide").textContent =
      `次に入力する数字：${nextChar}`;

  } else {

    $("guide").textContent =
      "日本語入力で課題を入力してください";

  }

}


// =====================================
// 音声読み上げ
// =====================================

function speakTerm() {

  if (!currentWord) return;

  if (!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const text =
    currentWord.term +
    "。" +
    currentWord.meaning;

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "ja-J";

  speech.rate = 0.95;

  speechSynthesis.speak(speech);

}


// =====================================
// 次の問題
// =====================================

function nextQuestion() {

  clearTimeout(questionTimer);

  if (questionNumber >= TOTAL) {

    endGame();

    return;
  }

  locked = false;

  questionNumber++;

  const random =
    Math.floor(Math.random() * wordList.length);

  currentWord = wordList[random];

  $("term").textContent =
    currentWord.term;

  $("meaning").textContent =
    currentWord.meaning;

  $("progress").textContent =
    `${questionNumber} / ${TOTAL}`;

  $("answer").value = "";

  $("answer").disabled = false;

  $("answer").focus();

  updateGuide();

  speakTerm();

}


// =====================================
// ゲーム開始
// =====================================

function startGame() {

  if (!wordList.length) {

    alert(
      "課題データがありません。読み込みを確認してください。"
    );

    return;
  }

  playing = true;

  locked = false;

  questionNumber = 0;

  score = 0;

  $("start").disabled = true;

  nextQuestion();

}


// =====================================
// 正解判定
// =====================================

function checkAnswer() {

  if (!playing) return;

  if (locked) return;

  if (composing) return;

  const typed =
    normalize($("answer").value);

  const target =
    normalize(currentWord.term);

  if (typed === target) {

    locked = true;

    score++;

    $("answer").disabled = true;

    $("guide").textContent =
      "正解！ 🎉";

    questionTimer = setTimeout(() => {

      nextQuestion();

    }, 1200);

  }

}


// =====================================
// ゲーム終了
// =====================================

function endGame() {

  playing = false;

  locked = false;

  currentWord = null;

  $("term").textContent =
    "🎉 ゲーム終了！";

  $("meaning").textContent =
    `正答数：${score} / ${TOTAL}`;

  $("progress").textContent = "";

  $("typing").innerHTML = "";

  $("answer").value = "";

  $("answer").disabled = true;

  $("guide").textContent = "";

  $("start").disabled = false;

  $("start").textContent =
    "もう一度スタート [1]";

}


// =====================================
// ボタン操作
// =====================================

$("start").onclick = startGame;

$("skip").onclick = () => {

  if (!playing || locked) return;

  nextQuestion();

};

$("speak").onclick = speakTerm;


// =====================================
// 日本語IME対応
// =====================================

$("answer").addEventListener(
  "compositionstart",
  () => {

    composing = true;

  }
);

$("answer").addEventListener(
  "compositionend",
  () => {

    composing = false;

    updateGuide();

    checkAnswer();

  }
);

$("answer").addEventListener(
  "input",
  () => {

    if (composing) return;

    updateGuide();

    checkAnswer();

  }
);


// =====================================
// ショートカット
// =====================================

document.addEventListener("keydown", event => {

  if (event.repeat) return;

  if (event.isComposing) return;

  if (event.target.tagName === "INPUT") return;

  if (event.target.tagName === "TEXTAREA") return;

  if (event.key === "1" && !playing) {

    event.preventDefault();

    startGame();

  }

  if (event.key === "2" && playing) {

    event.preventDefault();

    if (!locked) nextQuestion();

  }

  if (event.key === "3" && playing) {

    event.preventDefault();

    speakTerm();

  }

});


// =====================================
// 初期読み込み
// =====================================

loadGoogleData();

</script>

</body>
</html>
